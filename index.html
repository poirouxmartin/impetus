<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glisse</title>
  </head>
  <body>
    <div id="app">
      <h1>Glisse</h1>
      <div id="layout">
        <div id="board-area">
          <div id="evalbar"><div id="evalbar-white"></div></div>
          <div id="board-stack">
            <canvas id="board" width="630" height="630"></canvas>
            <div id="banner" hidden>
              <div class="card">
                <div class="title"></div>
                <div class="sub"></div>
              </div>
            </div>
          </div>
        </div>
        <aside id="panel">
          <div id="status"></div>
          <div id="reserves"></div>
          <section class="group">
            <label id="mode-label">
              <span>Mode</span>
              <select id="mode">
                <option value="ai" selected>Contre l'IA</option>
                <option value="hotseat">2 joueurs</option>
              </select>
            </label>
            <label id="side-label">
              <span>Ta couleur</span>
              <select id="side">
                <option value="black" selected>Noir (commence)</option>
                <option value="white">Blanc</option>
              </select>
            </label>
            <label id="level-label">
              <span>Niveau de l'IA</span>
              <select id="level">
                <option value="facile">Facile</option>
                <option value="normal" selected>Normal</option>
                <option value="difficile">Difficile</option>
              </select>
            </label>
          </section>
          <section class="group">
            <label class="check">
              <input type="checkbox" id="live" />
              <span>Analyse en direct</span>
            </label>
            <div id="eval-line">Analyse désactivée</div>
            <div id="lines"></div>
            <div id="engine-info"></div>
          </section>
          <div id="controls">
            <button id="new">Nouvelle partie</button>
            <button id="undo" disabled>Annuler</button>
            <button id="swap" hidden>Échanger (swap)</button>
          </div>
          <p class="hint">
            Pose sur ta rangée de départ ou glisse une pierre (max 3 cases, percute un ennemi =
            capture). Trois façons de gagner : percée, anéantissement, immobilisation.
          </p>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
